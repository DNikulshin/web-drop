services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: webdrop
      POSTGRES_PASSWORD: webdrop
      POSTGRES_DB: webdrop
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webdrop"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
    command: server /data --console-address ":9001"
    # 👇 Добавлен обязательный healthcheck, который запрашивал minio-init
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio-init:
    image: minio/mc
    depends_on:
      minio: { condition: service_healthy }
    # Скрипт дополнен проверкой доступности порта перед конфигурацией бакета
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do echo 'Waiting for MinIO...'; sleep 1; done;
      mc mb local/webdrop --ignore-existing;
      mc anonymous set download local/webdrop;
      exit 0;
      "

volumes:
  postgres_data: {}
  redis_data: {}
  minio_data: {}
